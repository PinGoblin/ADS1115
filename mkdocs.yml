site_name: PinGoblin ADS1115 ADC Breakout
site_description: User guide and Python / MicroPython code for the PinGoblin ADS1115 4-channel 16-bit ADC breakout
site_url: https://pingoblin.github.io/ADS1115/
repo_url: https://github.com/PinGoblin/ADS1115
repo_name: PinGoblin/ADS1115
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 PinGoblin. MIT licence.

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Light mode

nav:
  - Home: index.md
  - User guide:
      - user-guide/index.md
      - Board layout and pinouts: user-guide/board-layout.md
      - Quick start: user-guide/quick-start.md
      - Connecting sensors: user-guide/connecting-sensors.md
      - Configuration: user-guide/configuration.md
      - Accuracy and calibration: user-guide/accuracy.md
      - Electrical specifications and safety: user-guide/specifications.md
      - Troubleshooting: user-guide/troubleshooting.md
  - API:
      - api/index.md
      - Examples:
          - Raspberry Pi: api/examples-python.md
          - MicroPython: api/examples-micropython.md
      - API reference:
          - Raspberry Pi module (breakout_ads): api/reference/breakout_ads.md
          - MicroPython module (ads1115): api/reference/ads1115.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
  - autorefs
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [python, micropython]
          options:
            docstring_style: google
            docstring_section_style: table
            merge_init_into_class: true
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true
            show_source: false
            show_root_heading: false
            show_root_toc_entry: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            filters: ["!^_"]
            heading_level: 2
